[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memorycore"
version = "0.2.0"
description = "A portable external memory layer for any LLM, agent, CLI, or tool-connected system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Carlosdanger96", email = "carlosdanger96@gmail.com"}
]
keywords = ["memory", "llm", "mcp", "agents", "external-memory"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9.9"]
cozo = ["cozo>=0.1.0"]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    "memorycore[postgres,cozo,test]",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
memorycore-mcp = "memorycore.mcp_server_v2:main"

[project.urls]
Homepage = "https://github.com/Carlosdanger96/Memorycore"
Documentation = "https://github.com/Carlosdanger96/Memorycore#readme"
Repository = "https://github.com/Carlosdanger96/Memorycore"
Issues = "https://github.com/Carlosdanger96/Memorycore/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["memorycore*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
python_files = "test_*.py"
testpaths = ["tests"]
addopts = "-v --tb=short"
