[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "memorycore"
version = "0.1.0.dev0"
description = "Local-first SQLite memory service for LLMs and agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
memorycore = "memorycore.cli:main"
memorycore-mcp = "memorycore.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
