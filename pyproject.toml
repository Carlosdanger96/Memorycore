[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "memorycore"
version = "0.1.0.dev0"
description = "Shared durable memory service for multiple LLMs and agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
mcp = ["mcp>=1,<2"]
mcp-test = ["memorycore[test,mcp]", "pytest-asyncio>=0.23"]
postgres = ["SQLAlchemy>=2.0", "psycopg[binary]>=3.1"]
dev = ["memorycore[mcp-test,postgres]"]

[project.scripts]
memorycore = "memorycore.cli:main"
memorycore-mcp = "memorycore.mcp_server:main"
memorycore-service = "memorycore.mcp_server:main"
memorycore-api = "memorycore.api.omni_routes:main"
memorycore-demo = "memorycore.demo.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
