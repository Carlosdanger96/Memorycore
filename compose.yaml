services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: memorycore
      POSTGRES_USER: memorycore
      POSTGRES_PASSWORD: change-me-before-sharing
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - memorycore-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memorycore -d memorycore"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  memorycore-postgres:
