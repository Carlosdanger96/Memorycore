name: Omni Memory Harness

on:
  push:
    branches: [hackathon/omni-memory-harness]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[mcp-test]"
      - run: python -m compileall -q src tests scripts demo
      - run: python -m pytest -q

  offline-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[mcp-test]"
      - run: ./scripts/demo.sh
        env:
          MEMORYCORE_DEMO_PYTHON: python
      - run: python scripts/verify_demo.py

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[mcp-test]"
      - shell: pwsh
        run: .\scripts\demo.ps1
        env:
          MEMORYCORE_DEMO_PYTHON: python

  security-and-migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[mcp-test]"
      - name: Verify forbidden runtime files are absent
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(\.env|.*\.(db|sqlite|sqlite3)|__pycache__)(/|$)'; then
            echo "Forbidden runtime file is tracked"
            exit 1
          fi
      - run: python -m pytest -q tests/test_database.py tests/test_persistence.py tests/test_omni_audit_provider.py tests/test_omni_demo.py
