name: storage-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  storage:
    runs-on: ubuntu-latest
    env:
      MEMORYCORE_TEST_POSTGRES_URL: postgresql://memorycore:memorycore-ci@127.0.0.1:5432/memorycore
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: memorycore
          POSTGRES_USER: memorycore
          POSTGRES_PASSWORD: memorycore-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memorycore -d memorycore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[mcp-test,postgres,oauth]"
      - run: python -m compileall src tests
      - run: pytest
      - run: memorycore --db ./ci-memorycore.db init
      - run: memorycore --db ./ci-memorycore.db doctor
