# Append to Vibe's config.toml. Supply the token in the process environment.
# Use a distinct writer token in Memorycore's private HTTP client registry.
[[mcp_servers]]
name = "memorycore"
transport = "streamable-http"
url = "http://127.0.0.1:8000/mcp"
startup_timeout_sec = 15
tool_timeout_sec = 60

[mcp_servers.auth]
type = "static"
api_key_env = "MEMORYCORE_VIBE_TOKEN"
api_key_format = "Bearer {token}"
